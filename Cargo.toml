[package]
name = "sailfish2"
version = "2.3.0"
authors = ["dax"]
license = "MIT"
description = "USI shogi engine"
edition = "2021"

[dependencies]

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"

[features]
# 玉からの相対位置の範囲（既定は ±3）。学習したネットワークとエンジンで同じ範囲にそろえる必要がある。
kr2 = []
kr4 = []
kr8 = []
# 第1層（アキュムレータ）の幅（既定は 64）。実験B用。学習したネットワークとエンジンで同じ幅にそろえる必要がある。
h128 = []
h256 = []
