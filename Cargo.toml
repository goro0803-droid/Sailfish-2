[package]
name = "sailfish2"
version = "2.4.0"
authors = ["dax"]
license = "MIT"
description = "USI shogi engine"
edition = "2021"

[dependencies]

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"

[features]
# 玉からの相対位置の範囲（既定は ±3）。学習したネットワークとエンジンで同じ範囲にそろえる必要がある。
kr2 = []
kr4 = []
kr8 = []
# 第1層（アキュムレータ）の幅（2.4 から既定は 256。2.3 までは 64）。学習したネットワークとエンジンで同じ幅にそろえる必要がある。
# h256 は既定と同じ（以前のビルド手順との互換のために残す）。
h64 = []
h128 = []
h256 = []
# 入力を HalfKP 型（自玉の升 × 駒）にする（実験C2）。内蔵のネットは使えないので EvalFile で読む
halfkp = []
